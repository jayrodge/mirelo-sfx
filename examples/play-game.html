<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Alien shooter — Mirelo SFX</title><style>

*{box-sizing:border-box}body{margin:0;background:#0c1429;color:#f5f2dd;display:flex;min-height:100vh;flex-direction:column;align-items:center;justify-content:center;font-family:ui-monospace,monospace}canvas{display:block;width:min(100vw,1280px);height:auto;max-height:calc(100vh - 74px);aspect-ratio:16/9;outline:none}.controls{width:min(100%,1280px);padding:14px 24px;display:flex;align-items:center;justify-content:space-between;gap:20px;font-size:20px;line-height:26px}button{font-family:inherit;font-size:18px;line-height:24px;padding:8px 14px;background:#151f38;border:2px solid #64779b;color:#f5f2dd;cursor:pointer}button:focus-visible{outline:3px solid #71f0df}
</style></head><body><canvas id="game" width="1280" height="720" tabindex="0" aria-label="Alien shooter. Arrow keys move, space fires, R restarts, M toggles sound."></canvas><div class="controls"><span>← → MOVE · SPACE FIRE · R RESTART · MIRELO SFX</span><button id="sound-toggle" type="button">SOUND ON · M</button></div><audio id="hit-sound" preload="auto" src="alien-hit-mirelo.wav"></audio><script>
const ART={"enemy": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"180\" height=\"140\" viewBox=\"0 0 180 140\"><g id=\"enemy-art\">\n<path d=\"M36 44 L10 28 L10 53 L27 67 L8 81 L8 101 L35 91 L49 107 L39 128 L65 128 L79 111 L101 111 L115 128 L141 128 L131 107 L145 91 L172 101 L172 81 L153 67 L170 53 L170 28 L144 44 L125 25 L105 25 L90 10 L75 25 L55 25 Z\" fill=\"#f56b59\" stroke=\"#16233a\" stroke-width=\"6\" stroke-linejoin=\"miter\"/>\n<path d=\"M49 52 L62 37 L118 37 L131 52 L131 88 L116 103 L64 103 L49 88 Z\" fill=\"#ffbd66\" stroke=\"#16233a\" stroke-width=\"6\"/>\n<path d=\"M61 59 L82 59 L82 76 L61 76 Z M98 59 L119 59 L119 76 L98 76 Z\" fill=\"#16233a\"/>\n<path d=\"M76 90 L104 90\" stroke=\"#f56b59\" stroke-width=\"7\"/>\n<path d=\"M19 36 L33 45 M147 45 L161 36\" stroke=\"#ffbd66\" stroke-width=\"6\"/>\n</g></svg>", "player": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"180\" height=\"112\" viewBox=\"0 0 180 112\"><g id=\"player-art\">\n<path d=\"M90 3 L111 44 L140 57 L172 102 L114 89 L104 105 L76 105 L66 89 L8 102 L40 57 L69 44 Z\" fill=\"#71f0df\" stroke=\"#16233a\" stroke-width=\"6\" stroke-linejoin=\"miter\"/>\n<path d=\"M90 28 L105 58 L105 78 L75 78 L75 58 Z\" fill=\"#287f93\" stroke=\"#16233a\" stroke-width=\"5\"/>\n<path d=\"M87 42 L93 42 L99 58 L81 58 Z\" fill=\"#d7fff6\"/>\n<path d=\"M34 83 L62 65 L61 85 Z M146 83 L118 65 L119 85 Z\" fill=\"#287f93\"/>\n<path d=\"M82 94 L98 94\" stroke=\"#d7fff6\" stroke-width=\"6\"/>\n</g></svg>", "blast": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"260\" height=\"260\" viewBox=\"0 0 260 260\"><g id=\"blast-art\"><path d=\"M130 4 L150 61 L191 25 L181 86 L248 67 L204 115 L257 143 L198 158 L235 215 L172 195 L158 254 L126 203 L85 249 L82 188 L21 212 L57 157 L3 129 L58 108 L23 53 L87 74 L99 15 L119 65 Z\" fill=\"#f56b59\" stroke=\"#ffad48\" stroke-width=\"8\"/><path d=\"M130 40 L151 91 L204 63 L177 113 L220 136 L175 152 L190 199 L147 178 L130 225 L111 175 L63 195 L85 151 L38 130 L87 112 L66 70 L111 91 Z\" fill=\"#ffe170\"/></g></svg>"};
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
// A trimmed hit from the bundled Mirelo generation; playback spends no credits.
window.arcadeAudioFile='alien-hit-mirelo.wav';
window.arcadeSoundEnabled=true;
const hitAudio=document.getElementById('hit-sound');
window.onArcadeHit=()=>{if(window.arcadeSoundEnabled){if(!hitAudio.src.endsWith(window.arcadeAudioFile))hitAudio.src=window.arcadeAudioFile;hitAudio.currentTime=0;hitAudio.play().catch(()=>{});}};
window.setArcadeAudioFile=path=>{window.arcadeAudioFile=path;hitAudio.src=path;};
const toggleSound=()=>{window.arcadeSoundEnabled=!window.arcadeSoundEnabled;document.getElementById('sound-toggle').textContent=window.arcadeSoundEnabled?'SOUND ON · M':'SOUND OFF · M';canvas.focus();};
document.getElementById('sound-toggle').addEventListener('click',toggleSound);
const images={};
const ready=Promise.all(Object.entries(ART).map(([name,svg])=>new Promise(resolve=>{const img=new Image();img.onload=()=>{images[name]=img;resolve();};img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);} )));
const keys=new Set();let score=0,lives=3,wave=1,playerX=280,shots=[],enemies=[],bursts=[],time=0,fireAt=-1,clearAt=null,dead=false;
function spawn(){enemies=[280,640,1010].map((x,i)=>({x,y:226+i*24,phase:i,alive:true}));clearAt=null;}
function restart(){score=0;lives=3;wave=1;playerX=280;shots=[];bursts=[];time=0;fireAt=-1;dead=false;spawn();}
window.arcadeState=()=>({score,lives,wave,playerX,enemiesAlive:enemies.filter(e=>e.alive).length,soundEnabled:window.arcadeSoundEnabled});
function fire(){if(dead||time-fireAt<.25)return;shots.push({x:playerX,y:548});fireAt=time;}
addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault();keys.add(e.code);if(e.code==='Space')fire();if(e.code==='KeyR')restart();if(e.code==='KeyM'&&!e.repeat)toggleSound();});addEventListener('keyup',e=>keys.delete(e.code));addEventListener('blur',()=>keys.clear());canvas.addEventListener('click',()=>canvas.focus());
function update(dt){if(dead)return;time+=dt;if(keys.has('ArrowLeft'))playerX=Math.max(135,playerX-500*dt);if(keys.has('ArrowRight'))playerX=Math.min(1145,playerX+500*dt);if(keys.has('Space'))fire();for(const s of shots)s.y-=1100*dt;
for(const e of enemies){if(!e.alive)continue;e.y+=18*dt;for(const s of shots){if(!s.used&&Math.abs(s.x-e.x)<70&&s.y<e.y+59&&s.y>e.y-69){s.used=true;e.alive=false;score+=100;bursts.push({x:e.x,y:e.y,age:0});window.onArcadeHit({score,wave,x:e.x,y:e.y});break;}}if(e.alive&&e.y>550){e.alive=false;lives--;if(lives<=0)dead=true;}}
shots=shots.filter(s=>!s.used&&s.y>144);for(const b of bursts)b.age+=dt;bursts=bursts.filter(b=>b.age<.42);if(enemies.every(e=>!e.alive)){if(clearAt===null)clearAt=time;if(time-clearAt>1){wave++;spawn();}}
}
function draw(){ctx.fillStyle='#0c1429';ctx.fillRect(0,0,1280,720);ctx.fillStyle='#151f38';ctx.fillRect(0,0,1280,144);ctx.fillRect(0,664,1280,56);ctx.strokeStyle='#324365';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(0,142);ctx.lineTo(1280,142);ctx.moveTo(0,664);ctx.lineTo(1280,664);ctx.stroke();ctx.font='900 72px system-ui';ctx.fillStyle='#f5f2dd';ctx.fillText('GAMEPLAY',64,87);ctx.font='26px monospace';ctx.fillStyle='#71f0df';ctx.fillText('WAVE '+String(wave).padStart(2,'0')+' / ALIEN ATTACK',66,130);ctx.textAlign='right';ctx.fillStyle='#f5f2dd';ctx.fillText('SCORE',1216,52);ctx.font='48px monospace';ctx.fillStyle='#ffe170';ctx.fillText(String(score).padStart(6,'0'),1216,108);ctx.font='26px monospace';ctx.fillStyle='#f5f2dd';ctx.fillText('SHIPS '+String(lives).padStart(2,'0'),1216,704);ctx.textAlign='left';ctx.fillStyle='#71f0df';ctx.fillText('PLAYER 01',64,704);
for(let i=0;i<23;i++){const x=70+((i*317)%1130),y=167+((i*173)%455);ctx.fillStyle=i%5===0?'#f5f2dd':'#64779b';ctx.fillRect(x,y,i%5===0?6:4,i%5===0?6:4);}
for(const e of enemies)if(e.alive)ctx.drawImage(images.enemy,e.x-90,e.y-70,180,140);ctx.drawImage(images.player,playerX-90,544,180,112);ctx.fillStyle='#d7fff6';for(const s of shots){ctx.fillRect(s.x-6,s.y,12,36);ctx.strokeStyle='#71f0df';ctx.lineWidth=3;ctx.strokeRect(s.x-6,s.y,12,36);}for(const b of bursts){const scale=.8+Math.min(1,b.age/.12)*.3,size=260*scale;ctx.globalAlpha=1-b.age/.42;ctx.drawImage(images.blast,b.x-size/2,b.y-size/2,size,size);if(b.age<.1){ctx.fillStyle='#fff3ba';ctx.beginPath();ctx.arc(b.x,b.y,71*(1-b.age/.15),0,Math.PI*2);ctx.fill();}ctx.globalAlpha=1;}
if(dead){ctx.fillStyle='#151f38';ctx.fillRect(300,292,680,126);ctx.textAlign='center';ctx.font='900 58px system-ui';ctx.fillStyle='#ffe170';ctx.fillText('GAME OVER',640,355);ctx.font='26px monospace';ctx.fillStyle='#f5f2dd';ctx.fillText('R TO RESTART',640,397);ctx.textAlign='left';}
}
let previous=null;function frame(ts){const dt=previous===null?0:Math.min(.05,(ts-previous)/1000);previous=ts;update(dt);draw();requestAnimationFrame(frame);}
Promise.all([ready,document.fonts.ready]).then(()=>{restart();canvas.focus();requestAnimationFrame(frame);});
</script></body></html>
